topic:
  key: zero_downtime_migrations
  name: Zero-Downtime Migrations
  track_key: sql_postgres
  depth_target: Strong
  prerequisites: ["modeling_constraints", "indexing"]
  objectives:
    - Write migrations that don't lock tables or cause downtime
