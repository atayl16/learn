checkpoint:
  passing_score: 7
  questions:
    - kind: mcq
      points: 2
      prompt: "What is the primary reason to count tokens before making LLM API calls?"
      choices:
        - "To validate the input text is UTF-8 encoded"
        - "To estimate cost and ensure input fits within model context limits"
        - "To improve API response time"
        - "To encrypt the request payload"
      correct: "To estimate cost and ensure input fits within model context limits"
      why: "Token counting lets you calculate API costs before making requests and prevents errors from exceeding context windows (e.g., GPT-4's 128K token limit). Each token costs money, and oversized inputs can cost $5+ per request or fail entirely."

    - kind: mcq
      points: 2
      prompt: "What is the recommended retry strategy for handling 429 (rate limit) errors from LLM APIs?"
      choices:
        - "Retry immediately without delay"
        - "Retry once after 5 seconds"
        - "Exponential backoff with jitter (e.g., 1s, 2s, 4s + random)"
        - "Give up immediately and return an error"
      correct: "Exponential backoff with jitter (e.g., 1s, 2s, 4s + random)"
      why: "Exponential backoff prevents thundering herd problems where many clients retry simultaneously. Jitter (random delay) further distributes retry attempts. This is the industry standard for handling rate limits."

    - kind: short
      points: 2
      prompt: "Where should you store LLM API keys in a Rails application, and why?"
      sample_answer: "Store API keys in Rails encrypted credentials (rails credentials:edit) or environment variables, never in version control or client-side code. This prevents unauthorized access and cost overruns from leaked keys."

    - kind: mcq
      points: 1
      prompt: "What is the purpose of the 'temperature' parameter in LLM API calls?"
      choices:
        - "Controls how long the API waits before timing out"
        - "Sets the maximum number of tokens in the response"
        - "Controls randomness/creativity (0 = deterministic, 1 = creative)"
        - "Determines which GPU processes the request"
      correct: "Controls randomness/creativity (0 = deterministic, 1 = creative)"
      why: "Temperature 0-0.3 produces consistent, factual outputs (ideal for structured data). Temperature 0.7-1.0 produces creative, varied responses (ideal for content generation). It's a key prompt engineering parameter."

    - kind: short
      points: 2
      prompt: "Write code to calculate the cost of a GPT-4o API call with 2,000 input tokens and 150 output tokens. (GPT-4o pricing: $0.0025/1K input, $0.01/1K output)"
      sample_answer: "cost = (2000 * 0.0025 / 1000) + (150 * 0.01 / 1000) = 0.005 + 0.0015 = $0.0065 or cost = (2000 / 1000) * 0.0025 + (150 / 1000) * 0.01"

    - kind: mcq
      points: 1
      prompt: "Why should you never send LLM API keys to browsers or mobile apps?"
      choices:
        - "Browsers don't support HTTPS connections"
        - "Keys can be extracted from client code, leading to abuse and unlimited costs"
        - "LLM APIs block requests from browsers"
        - "It violates GDPR regulations"
      correct: "Keys can be extracted from client code, leading to abuse and unlimited costs"
      why: "Client-side code is visible to users who can extract keys and make unlimited API calls, draining your budget. Always proxy requests through your backend with authentication and rate limiting."

    - kind: mcq
      points: 2
      prompt: "What is the benefit of using 'response_format: { type: \"json_object\" }' in OpenAI API calls?"
      choices:
        - "Reduces API costs by 50%"
        - "Ensures the model returns valid JSON, making parsing reliable"
        - "Enables streaming responses"
        - "Increases the maximum token limit"
      correct: "Ensures the model returns valid JSON, making parsing reliable"
      why: "JSON mode guarantees the response is valid JSON, preventing parsing errors. This is crucial for structured data extraction where you need consistent, machine-readable output."

    - kind: short
      points: 2
      prompt: "What caching strategy would you use to avoid repeat LLM API calls for identical inputs? Provide a Rails example."
      sample_answer: "Use Rails.cache.fetch with a hash of the input as the cache key: Rails.cache.fetch(\"llm:#{Digest::SHA256.hexdigest(text)}\", expires_in: 24.hours) { api_call(text) }"

    - kind: mcq
      points: 1
      prompt: "When should you implement streaming responses for LLM API calls?"
      choices:
        - "Always, for all LLM requests"
        - "Never, streaming is deprecated"
        - "For long-form content generation to improve perceived latency"
        - "Only when using Anthropic's Claude"
      correct: "For long-form content generation to improve perceived latency"
      why: "Streaming displays partial responses as they're generated, making 20-30 second responses feel instant. Use it for chatbots, article generation, or any UI where users expect real-time feedback. Skip it for short responses or background jobs."

    - kind: mcq
      points: 1
      prompt: "What is a 'system prompt' in LLM API integration?"
      choices:
        - "A prompt that checks system health before API calls"
        - "An instruction that defines the AI's behavior, role, and output format"
        - "A fallback message when the API is down"
        - "A prompt visible only to system administrators"
      correct: "An instruction that defines the AI's behavior, role, and output format"
      why: "System prompts (role: 'system') set behavior, tone, and constraints for the AI. For example: 'You are a Rails code reviewer. Output JSON with issues array.' They persist across the conversation and guide all responses."
