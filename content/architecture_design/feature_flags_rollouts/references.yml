    url: "https://github.com/jnunemaker/flipper/tree/master/docs/ui"
    why: "Admin interface for managing Flipper flags without console access."

  - title: "Feature Flags in Production (LaunchDarkly Blog)"
    url: "https://launchdarkly.com/blog/feature-flag-best-practices/"
    why: "Best practices for naming, monitoring, and cleaning up flags."

  - title: "Continuous Delivery (Jez Humble, David Farley)"
    url: "https://continuousdelivery.com/"
    why: "Covers deployment pipelines, feature flags, and decoupling release from deploy."

  - title: "Feature Flag Driven Development (Charity Majors)"
    url: "https://charity.wtf/2020/06/08/feature-flag-driven-development/"
