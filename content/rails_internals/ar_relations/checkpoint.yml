checkpoint:
  passing_score: 7
  questions:
    - kind: mcq
      points: 2
      prompt: "When does User.where(active: true) execute a database query?"
      choices:
        - "Immediately when the line runs"
        - "When you call .to_a, .each, .count, or similar"
        - "Only when you call .execute"
        - "Never, it's a class method"
      correct: "When you call .to_a, .each, .count, or similar"
      why: "Relations are lazy and defer execution until enumeration or aggregation."

    - kind: mcq
      points: 2
      prompt: "What's the difference between joins and includes?"
      choices:
        - "No difference, they're aliases"
        - "joins filters via SQL JOIN; includes preloads associations"
        - "includes is deprecated"
        - "joins is faster in all cases"
      correct: "joins filters via SQL JOIN; includes preloads associations"
      why: "joins runs a SQL JOIN but doesn't load associations; includes prevents N+1 by preloading."

    - kind: short
      points: 3
      prompt: "Write a scope that returns users created in the last 30 days with active status."
      sample_answer: "scope :recent_active, -> { where(active: true).where('created_at > ?', 30.days.ago) }"

    - kind: mcq
      points: 1
      prompt: "Which method returns an array instead of ActiveRecord objects?"
      choices:
        - "select"
        - "pluck"
        - "where"
        - "find"
      correct: "pluck"
      why: "pluck extracts column values without instantiating ActiveRecord objects, returning an array."

    - kind: short
      points: 2
      prompt: "How would you check the SQL generated by User.active.recent without executing it?"
      sample_answer: "User.active.recent.to_sql"
